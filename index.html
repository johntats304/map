<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tellering Offices Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <h1>Tellering Offices</h1>

    <div class="box">
      <button id="btn-gps" class="primary">📍 Use my current location</button>
      <p class="hint">Or tap anywhere on the map to pin where you are. You can drag the pin to adjust.</p>
      <p id="status" class="hint"></p>
    </div>

    <div class="box">
      <label for="mode">Travel mode</label>
      <select id="mode">
        <option value="driving">Driving / motorcycle</option>
        <option value="walking">Walking</option>
        <option value="transit">Public transport</option>
        <option value="bicycling">Bicycle</option>
      </select>
    </div>

    <div class="box">
      <label for="pref">Route preference</label>
      <select id="pref">
        <option value="recommended">Recommended (shortest, unless much slower)</option>
        <option value="shortest">Shortest distance</option>
        <option value="fastest">Fastest time</option>
      </select>
    </div>

    <div id="nearest" class="box hidden"></div>

    <h2>All offices</h2>
    <p class="hint">Tap an office to choose it as your preferred one.</p>
    <ul id="list"></ul>
  </aside>
  <div id="map"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
